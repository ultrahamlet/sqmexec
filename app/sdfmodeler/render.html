<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>sqm レンダリング設定</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #16181d; --panel: #1e2129; --panel2: #262a34; --line: #333845;
  --fg: #d7dae2; --dim: #8a90a0; --acc: #e8973a; --sel: #2d4a6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.5 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  display: grid; grid-template-columns: 300px 1fr; grid-template-rows: 1fr auto;
  grid-template-areas: "side view" "st st"; height: 100vh;
}
#side { grid-area: side; background: var(--panel); border-right: 1px solid var(--line);
  padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.side-top { flex: none; display: flex; flex-direction: column; gap: 6px; }
#panel { flex: 1 1 auto; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 6px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 0; }
.side-bottom { flex: none; display: flex; flex-direction: column; gap: 6px; }
#side h4 { margin: 8px 0 2px; color: var(--acc); font-size: 12px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
#side h4:first-child { margin-top: 0; }
.frow { display: flex; align-items: center; gap: 6px; }
.frow label { flex: 1; color: var(--dim); font-size: 12px; }
.frow input[type=number], .frow select { width: 92px; }
input, select, button {
  background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
  border-radius: 5px; padding: 4px 7px; font: inherit;
}
button { cursor: pointer; } button:hover { border-color: var(--acc); }
button:disabled { opacity: 0.5; cursor: default; }
.presets { display: flex; gap: 5px; }
.presets button { flex: 1; padding: 5px 4px; }
.bigbtn { background: var(--acc); color: #16181d; font-weight: 700; border-color: var(--acc); padding: 9px; font-size: 14px; }
.row2 { display: flex; gap: 6px; }
.row2 > * { flex: 1; }
#view { grid-area: view; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; background: #0d0e11; }
#result { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; display: none; }
#placeholder { color: var(--dim); text-align: center; }
#status { grid-area: st; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
#status.err { color: #f08080; }
.hint { color: var(--dim); font-size: 11px; margin: 2px 0; }
hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
</style>
</head>
<body>
  <div id="side">
    <div class="side-top">
      <button id="btnRender" class="bigbtn">▶ レンダリング開始</button>
      <div class="presets">
        <button id="preset_draft">ドラフト</button>
        <button id="preset_standard">標準</button>
        <button id="preset_high">高品質</button>
      </div>
    </div>
    <div id="panel"></div>
    <div class="side-bottom">
      <div class="row2">
        <button id="btnSavePng">PNG 保存</button>
        <button id="btnReset">既定に戻す</button>
      </div>
      <div class="row2">
        <button id="btnExport">JSON 書き出し</button>
        <button onclick="document.getElementById('fileImport').click()">JSON 読み込み</button>
      </div>
      <input type="file" id="fileImport" accept=".json" style="display:none">
      <button onclick="document.getElementById('fileScene').click()" title="sdfmodeler が別ポート/未起動のとき、レンダするシーンを直接指定">.ssq を読み込み</button>
      <input type="file" id="fileScene" accept=".ssq,.txt" style="display:none">
    </div>
  </div>
  <div id="view">
    <div id="placeholder">「▶ レンダリング開始」で sdfmodeler の現在シーンを本レンダリングします</div>
    <img id="result" alt="render result">
  </div>
  <div id="status"></div>
  <script type="module" src="js/render/app.js"></script>
</body>
</html>
