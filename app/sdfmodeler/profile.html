<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>プロファイルエディタ — sqm sweep/lathe 断面</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #16181d; --panel: #1e2129; --panel2: #262a34; --line: #333845;
  --fg: #d7dae2; --dim: #8a90a0; --acc: #e8973a; --sel: #2d4a6b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.5 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  display: grid; grid-template-rows: auto 1fr auto;
  grid-template-columns: 1fr 240px; grid-template-areas: "tb tb" "cv side" "st st";
  height: 100vh;
}
#toolbar { grid-area: tb; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
#toolbar label { color: var(--dim); }
select, button, input[type=number] {
  background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
  border-radius: 5px; padding: 4px 8px; font: inherit;
}
button { cursor: pointer; }
button:hover { border-color: var(--acc); }
#btnApply { background: var(--acc); color: #16181d; font-weight: 600; border-color: var(--acc); }
#cv { grid-area: cv; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line);
  padding: 10px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
#side h4 { margin: 4px 0; color: var(--acc); font-size: 12px; }
.presets { display: flex; gap: 5px; flex-wrap: wrap; }
.presets button { padding: 3px 8px; }
#ptlist { display: flex; flex-direction: column; gap: 3px; max-height: 40vh; overflow: auto; }
.ptrow { display: flex; gap: 4px; align-items: center; padding: 2px; border-radius: 4px; }
.ptrow.sel { background: var(--sel); }
.ptrow span { width: 20px; color: var(--dim); text-align: right; }
.ptrow input { width: 100%; min-width: 0; padding: 2px 4px; }
#out { width: 100%; font: 11px/1.4 ui-monospace, monospace; resize: vertical; background: var(--panel2);
  color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 6px; }
#status { grid-area: st; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line);
  color: var(--dim); font-size: 12px; }
#status.err { color: #f08080; }
.hint { color: var(--dim); font-size: 11px; }
body[data-mode="lathe"] .sweep-only { display: none; }
</style>
</head>
<body data-mode="sweep">
  <div id="toolbar">
    <label>用途</label>
    <select id="selMode" title="断面/輪郭の種類。書き出しキーワードと制約が変わる">
      <option value="sweep">sweep 断面 (u,v)</option>
      <option value="lathe">lathe 輪郭 (r,y)</option>
      <option value="extrude">extrude 輪郭 (x,y)</option>
    </select>
    <label>曲線</label>
    <select id="selCurve">
      <option value="0">折れ線</option>
      <option value="1">スプライン</option>
      <option value="2">Bスプライン</option>
    </select>
    <label><input type="checkbox" id="chkClosed" checked> 閉じる</label>
    <button id="btnFit">全体表示</button>
    <span style="flex:1"></span>
    <button id="btnCopy">クリップボードへ</button>
    <button id="btnApply" title="BroadcastChannel で sdfmodeler へ送る">sdfmodeler へ適用</button>
  </div>
  <canvas id="cv"></canvas>
  <div id="side">
    <h4>プリセット</h4>
    <div class="presets" id="presets"></div>
    <h4>制御点</h4>
    <div id="ptlist"></div>
    <h4>書き出し</h4>
    <textarea id="out" rows="5" readonly></textarea>
    <p class="hint">クリック=点を追加 (エッジ上ならそこに挿入) / ドラッグ=移動 (Shift=0.05スナップ) /
      Delete=削除 / ホイール=ズーム / 中/右ドラッグ=パン</p>
  </div>
  <div id="status">プロファイルエディタ — 単体で編集し、右上「sdfmodeler へ適用」で送信</div>
  <script type="module" src="js/profile/app.js"></script>
</body>
</html>
